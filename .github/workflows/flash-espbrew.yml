name: Flash & Snap via ESPBrew

# Manual-only hardware workflow.
#
#   * `build`  -> ubuntu: compiles every selected board and packages a minimal
#                 espbrew-ready artifact per board (`cargo xtask pack` produces
#                 pack-<board>/{Cargo.toml,.cargo/config.toml,
#                 target/<triple>/release/<elf>}). Toolchains are auto-detected
#                 from each board's rust-toolchain.toml, so an xtensa board and a
#                 riscv board never share a toolchain install and can build in
#                 parallel.
#   * `wasm`   -> ubuntu: builds the browser (wasm) build IN PARALLEL with
#                 `build` (it needs only stable + wasm32, no xtensa). The result
#                 is published to GitHub Pages in `deploy` and is NEVER sent to
#                 espbrew.
#   * `snap`   -> [espbrew] self-hosted runner. That runner is only a *client*
#                 to the ESPBrew cluster leader (the physical board lives on the
#                 leader), so it flashes the firmware and captures a camera frame
#                 via `espbrew snap`. espbrew auto-detects the project from the
#                 downloaded pack-<board>, so no manual flash plan is required.
#   * `deploy` -> ubuntu: assembles the GitHub Pages site (a per-board screenshot
#                 gallery + the WASM browser build). Only the screenshots that
#                 were actually captured are staged, so a partial run still
#                 publishes a correct gallery.
#
# Board selection:
#
#   The `boards` input is a comma-separated list of project directories. Leave it
#   at the default to build/flash every registered board; set it to a single
#   board to fine-tune just that one. The list mirrors boards.yaml (the single
#   source of truth for the self-hosted flash job) and will be derived from it
#   automatically once the per-board template lands.
#
# Security: this workflow only triggers on manual dispatch, so pull requests
# (including from forks) can never execute steps on the self-hosted hardware
# runner. The snap job also carries a guard step as defense in depth. See the
# note at the bottom of this file about the matching GitHub repository settings.

on:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Comma-separated project dirs to build/flash (default: all registered boards)'
        type: string
        default: 'esp32-s3-box-3, esp32-s3-lcd-ev-board, m5stack-atom-s3, m5stack-atom-s3r, m5stack-core2, waveshare-esp32-s3-touch-lcd-1_28'
      enable_snap:
        description: 'Flash + capture a hardware snapshot via espbrew snap'
        type: boolean
        default: true
      publish_gallery:
        description: 'Deploy screenshot gallery + WASM browser build to GitHub Pages'
        type: boolean
        default: true
      snap_duration:
        description: 'Snap capture duration (seconds)'
        type: string
        default: '10'

# Self-hosted runners still need read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Parse the comma-separated `boards` input into a JSON array ONCE, then emit
  # it as a job output. `build` and `snap` consume it via `needs.setup`.
  #
  # A matrix expression may only use the `github`, `inputs`, `needs`, `vars`
  # contexts (never `steps`), so the parse cannot live inside a matrix step —
  # it must run in a job that the matrix jobs `need`.
  # ---------------------------------------------------------------------------
  setup:
    name: Parse board selection
    runs-on: ubuntu-26.04
    outputs:
      boards: ${{ steps.parse.outputs.json }}
    steps:
      - name: Parse selected boards
        id: parse
        env:
          BOARDS_INPUT: "${{ inputs.boards }}"
        run: |
          set -euo pipefail
          IFS=',' read -r -a parts <<< "${BOARDS_INPUT}"
          json="["
          first=1
          for b in "${parts[@]}"; do
            b="${b//[[:space:]]/}"
            [ -z "$b" ] && continue
            if [ "$first" -eq 1 ]; then json+="\"$b\""; first=0; else json+=", \"$b\""; fi
          done
          json+="]"
          if [ "$first" -eq 1 ]; then
            echo "::error::no boards selected (boards input was empty)" >&2
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "selected boards: ${json}"

  # ---------------------------------------------------------------------------
  # Build + package the selected boards. One matrix entry per board; each entry
  # builds and packs its own board. Toolchains are installed once, up-front,
  # based on what the selected boards need (see the "Install toolchains" step).
  # ---------------------------------------------------------------------------
  build:
    name: Build + package
    needs: setup
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchains for selected boards
        # Installs exactly what the selected boards need:
        #   * stable Rust        — always (riscv boards, and the xtask)
        #   * declared riscv tgt's — for every stable-channel board
        #   * xtensa (+esp)      — only if any esp-channel board is selected
        #
        # Everything is installed into the default RUSTUP_HOME so that rustup's
        # auto-detection (via each board's rust-toolchain.toml) resolves the
        # right toolchain during the matrix build. We deliberately do NOT source
        # ~/export-esp.sh here: it can point CARGO_HOME/RUSTUP_HOME at the esp
        # toolchain, which would redirect the stable/riscv builds away from the
        # default home. The build step relies on rustup auto-detection only,
        # exactly as the original single-board workflow did.
        env:
          BOARDS_INPUT: "${{ inputs.boards }}"
        run: |
          set -euo pipefail

          # Split the comma-separated board list, trimming whitespace.
          IFS=',' read -r -a parts <<< "${BOARDS_INPUT}"
          BOARDS=()
          for b in "${parts[@]}"; do
            b="${b//[[:space:]]/}"
            [ -n "$b" ] && BOARDS+=("$b")
          done
          if [ "${#BOARDS[@]}" -eq 0 ]; then
            echo "::error::no boards selected (boards input was empty)" >&2
            exit 1
          fi
          echo "Selected boards: ${BOARDS[*]}"

          # Base: stable Rust (riscv boards + the xtask maintenance binary).
          rustup toolchain install stable --profile minimal
          rustup default stable

          # Learn what else each board needs from its rust-toolchain.toml.
          RISCV_TARGETS=()
          INSTALL_XTENSA=0
          for board in "${BOARDS[@]}"; do
            tc="$board/rust-toolchain.toml"
            if [ ! -f "$tc" ]; then
              echo "::warning::'$board' has no rust-toolchain.toml; using stable default"
              continue
            fi
            if grep -qE 'channel[[:space:]]*=[[:space:]]*"stable"' "$tc"; then
              # stable board: collect the riscv targets it declares.
              while IFS= read -r tgt; do
                [ -n "$tgt" ] && RISCV_TARGETS+=("$tgt")
              done < <(grep -oE '"[a-z0-9]*riscv[a-z0-9]*-unknown-none-elf"' "$tc" | tr -d '"')
            elif grep -qE 'channel[[:space:]]*=[[:space:]]*"esp"' "$tc"; then
              INSTALL_XTENSA=1
            fi
          done

          # Add the riscv targets (dedup). A target that rustup cannot add
          # (e.g. a custom triple) is a warning, not a failure — the board may
          # ship its own target spec.
          if [ "${#RISCV_TARGETS[@]}" -gt 0 ]; then
            printf '%s\n' "${RISCV_TARGETS[@]}" | sort -u | while IFS= read -r t; do
              if rustup target add "$t"; then
                echo "riscv target ready: $t"
              else
                echo "::warning::could not add riscv target '$t' (board may need a custom target)" >&2
              fi
            done
          fi

          # Xtensa only if an esp-channel board is selected. espup registers the
          # toolchain as "+esp", so `channel = "esp"` auto-resolves during build.
          if [ "$INSTALL_XTENSA" -eq 1 ]; then
            echo "Installing xtensa (esp) toolchain..."
            curl -fsSL -o espup \
              "https://github.com/esp-rs/espup/releases/download/v0.18.0/espup-x86_64-unknown-linux-gnu"
            chmod +x espup
            ./espup install --toolchain-version 1.90.0.0
          else
            echo "No esp-channel board selected; skipping xtensa install."
          fi

          rustup show

      - name: Build xtask maintenance binary
        # Pre-build once so the per-board pack steps below reuse it instead of
        # racing to build it in parallel.
        run: |
          set -euo pipefail
          cargo build --release --manifest-path xtask/Cargo.toml

      - name: Build + pack ${{ matrix.board }}
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"
          echo ">>> Building $board"
          cd "$board"
          # rustup auto-selects the toolchain from $board/rust-toolchain.toml
          # (esp for xtensa boards, stable for riscv boards).
          cargo build --release
          cd ..
          echo ">>> Packing espbrew artifact for $board"
          cargo xtask pack --project "$board" --verbose
          echo "pack dir:"
          ls -la "pack-$board"

      - name: Upload pack-${{ matrix.board }}
        # Minimal espbrew-ready project (Cargo.toml, .cargo/config.toml and
        # target/<triple>/release ELF) so espbrew auto-discovers it on the runner.
        #
        # IMPORTANT: include-hidden-files MUST be true. espbrew's autodetect
        # keys on the dot-directory .cargo/config.toml, and upload-artifact
        # drops dot-files/dirs by default. Without it the artifact has
        # Cargo.toml + ELF but no .cargo/, so espbrew logs "no supported project
        # detected".
        if: hashFiles('pack-${{ matrix.board }}/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.board }}
          path: pack-${{ matrix.board }}/
          include-hidden-files: true
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build the browser (wasm) build in PARALLEL with the board builds above. It
  # needs only the stable toolchain + wasm32 target (no xtensa), so it runs on a
  # plain ubuntu runner alongside `build`. The WASM build is NEVER sent to
  # espbrew — it is published to GitHub Pages in the `deploy` job only.
  # ---------------------------------------------------------------------------
  wasm:
    name: Build WASM browser build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain + wasm32 target
        run: |
          set -euo pipefail
          # WASM needs only stable + wasm32 (no xtensa), so it does not touch the
          # board toolchain and can run in parallel with the firmware build.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Build WASM library (wasm32)
        run: |
          set -euo pipefail
          cd wasm
          # build.rs is a no-op for the wasm32 target, so this only produces the
          # .wasm (it deliberately does NOT build the native serve bin).
          cargo build --lib --target wasm32-unknown-unknown --release

      - name: Install matching wasm-bindgen-cli
        # The CLI schema version must EXACTLY match the wasm-bindgen crate used
        # to build the .wasm, or wasm-bindgen refuses to run. Cargo.lock is not
        # committed, so we read the resolved version at build time and fetch the
        # matching prebuilt CLI instead of `cargo install` (which rebuilds from
        # source each run).
        id: wb
        run: |
          set -euo pipefail
          wb_version="$(grep -A1 'name = "wasm-bindgen"' wasm/Cargo.lock \
            | awk '/version =/{gsub(/"/, "", $3); print $3; exit}')"
          if [ -z "${wb_version}" ]; then
            echo "::error::could not resolve wasm-bindgen version from wasm/Cargo.lock" >&2
            exit 1
          fi
          echo "version=${wb_version}" >> "$GITHUB_OUTPUT"
          # Extract the tarball into a dedicated, fully-accessible directory so the
          # locate step below only ever scans our own files. Scanning /tmp with
          # `find .` walks restricted dirs (systemd-private-*, snap-private-tmp)
          # that return permission-denied, which makes `find` exit non-zero and
          # trips `set -euo pipefail` — aborting before we even install the CLI.
          extract_dir="/tmp/wasm-bindgen-${wb_version}"
          mkdir -p "${extract_dir}"
          curl -fsSL -o wb.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${wb_version}/wasm-bindgen-${wb_version}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wb.tar.gz -C "${extract_dir}"
          # The musl tarball ships the binary at the top level of its extracted
          # dir (depth 2 from the extraction root), so a maxdepth-2 find is enough.
          bin="$(find "${extract_dir}" -maxdepth 2 -name wasm-bindgen -type f 2>/dev/null | head -1)"
          if [ -z "${bin}" ]; then
            echo "::error::could not locate the wasm-bindgen binary in the tarball" >&2
            exit 1
          fi
          # Install it at the repo root so it is on PATH for the packaging step.
          cp "${bin}" "./wasm-bindgen-cli" && chmod +x "./wasm-bindgen-cli"
          "./wasm-bindgen-cli" --version
          # Repo root (where we just installed wasm-bindgen-cli) on PATH.
          echo "$(pwd)" >> "$GITHUB_PATH"

      - name: Package with wasm-bindgen
        run: |
          set -euo pipefail
          cd wasm
          # Emit pkg/ (js + .wasm). The committed pkg/index.html — the page that
          # is served from Pages — is preserved by wasm-bindgen (it never deletes
          # files it does not manage), so it survives into the artifact.
          wasm-bindgen-cli --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/wasm_conways_game_of_life.wasm
          # Fail loud if the served page is somehow absent (e.g. a future
          # wasm-bindgen that clears the out-dir), rather than shipping a page
          # that 404s on the gallery link.
          if [ ! -f pkg/index.html ]; then
            echo "::error::pkg/index.html is missing after wasm-bindgen" >&2
            exit 1
          fi

      - name: Upload WASM build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: wasm/pkg/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Flash + capture a hardware snapshot per selected board on the self-hosted
  # ESPBrew runner.
  #
  # The runner is only a client to the cluster leader, so `espbrew snap`
  # auto-detects the firmware from the downloaded pack-<board> and flashes it at
  # the standard app offset. No manual flash plan is required.
  # ---------------------------------------------------------------------------
  snap:
    name: Flash & snap (espbrew)
    needs: [ build, setup ]
    if: github.event.inputs.enable_snap == 'true'
    runs-on: [espbrew]
    env:
      SNAP_DURATION: "${{ github.event.inputs.snap_duration }}"
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup.outputs.boards) }}
    steps:
      # --- Security: never run on untrusted PR / fork code -------------------
      - name: Refuse to run on PRs / forks
        if: github.event.pull_request != null || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This hardware workflow only runs on manual dispatch."
          echo "::error::It must never execute on pull requests or fork contributions."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download espbrew (arch-aware)
        run: |
          set -euo pipefail
          # The self-hosted runner may be x64 or arm; pick the matching espbrew
          # release so we never land an amd64 binary on an arm64 host (that
          # surfaces as an opaque "exec format error" mid-flash).
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/v0.8.1/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download firmware pack
        # Downloads the per-board artifact uploaded by the `build` job. A matrix
        # expression cannot use the `steps` context, so the download must be a
        # real `uses:` step (not a CLI invocation inside the flash run block).
        uses: actions/download-artifact@v7
        with:
          name: pack-${{ matrix.board }}
          path: pack-${{ matrix.board }}/

      - name: Flash + snap ${{ matrix.board }}
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"

          # The espbrew alias is registered in boards.yaml; fall back to the
          # project dir name when a board is not registered there yet.
          alias="$(awk -v p="$board" '
            /^  - alias:/ { a=$3 }
            /^    project:/ { if ($2 == p) print a }
          ' boards.yaml)"
          [ -z "$alias" ] && alias="$board"

          mkdir -p snapshots
          echo ">>> Flashing + snapping $alias"
          if [ ! -f "pack-$board/Cargo.toml" ]; then
            echo "::warning::$board pack artifact missing Cargo.toml; skipping flash"
            exit 0
          fi

          # Run from inside the pack dir so espbrew auto-detects the Rust project
          # (Cargo.toml + .cargo/config.toml), locates the ELF, and has the
          # cluster leader convert it to bootloader/partitions/app. espbrew writes
          # the captured frame into a per-board zip at snapshots/$board.zip (repo
          # root) so it can be uploaded as an artifact for the gallery deploy job.
          # The --zip path is relative to pack-$board/, hence the ../ above.
          ( cd "pack-$board" \
            && espbrew snap \
                --filter-alias "$alias" \
                --save-dir snap-out \
                --zip "../snapshots/$board.zip" \
                --duration "$SNAP_DURATION" )

      - name: Collect snapshots
        # Runs after the matrix on the same runner, so it sees every board's
        # snapshot zip and flattens the frames into a single screenshot set.
        #
        # ubuntu-26.04 runners do not put `unzip` or `python3` on PATH by
        # default: Python ships as a package but must be added via
        # setup-python, and `unzip` is installed but not on PATH. Install
        # unzip via apt so extraction is deterministic, then flatten every
        # board's frames (-j) into the single screenshots/ directory.
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          rm -rf screenshots && mkdir -p screenshots
          shopt -s nullglob
          for z in snapshots/*.zip; do
            unzip -o -j "$z" -d screenshots
          done
          echo "Collected screenshots:"
          ls -la screenshots/ || true

      - name: Upload gallery screenshots
        if: hashFiles('screenshots/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gallery-screenshots
          path: screenshots/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Assemble and publish the GitHub Pages site: a per-board screenshot gallery
  # (only the boards that were actually snapshotted appear with an image; the
  # rest get a placeholder) plus the WASM browser build (built in the parallel
  # `wasm` job, never flashed).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy gallery (Pages)
    needs: [build, wasm, snap]
    # Run when gallery publishing is requested and snap either succeeded or was
    # intentionally skipped (enable_snap=false).
    if: github.event.inputs.publish_gallery == 'true' && (needs.snap.result == 'success' || needs.snap.result == 'skipped')
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download WASM build
        uses: actions/download-artifact@v7
        with:
          name: wasm-build
          path: deploy/wasm

      - name: Download gallery screenshots
        # Fails silently when nothing was snapshotted (enable_snap=false or the
        # runner produced no frames).
        uses: actions/download-artifact@v7
        with:
          name: gallery-screenshots
          path: deploy/site/screenshots
        continue-on-error: true

      - name: Assemble gallery (per-board cards)
        env:
          BOARDS_INPUT: "${{ inputs.boards }}"
        run: |
          set -euo pipefail
          # Create the screenshot dir up front so the per-board find below never
          # runs against a missing path (which would abort under set -euo pipefail
          # when nothing was snapshotted).
          mkdir -p deploy/site deploy/site/screenshots

          # Copy the WASM browser build into the site (kept live, never flashed).
          cp -r deploy/wasm/. deploy/site/wasm/

          # Parse the selected boards.
          IFS=',' read -r -a parts <<< "${BOARDS_INPUT}"
          BOARDS=()
          for b in "${parts[@]}"; do
            b="${b//[[:space:]]/}"
            [ -n "$b" ] && BOARDS+=("$b")
          done

          # Build one .card per board: an <img> when a screenshot exists, else a
          # placeholder. Only the screenshots that were captured are staged.
          : > deploy/site/.cards.html
          if [ "${#BOARDS[@]}" -eq 0 ]; then
            {
              echo "    <div class=\"card\">"
              echo "        <h2>Hardware snapshot</h2>"
              echo "        <div class=\"placeholder\">No hardware snapshot captured yet.</div>"
              echo "    </div>"
            } >> deploy/site/.cards.html
          fi
          for board in "${BOARDS[@]}"; do
            img="$(find deploy/site/screenshots -type f -iname "${board}.*" 2>/dev/null \
                    | grep -E '\.(jpg|jpeg|png)$' | head -1 || true)"
            {
              echo "    <div class=\"card\">"
              echo "        <h2>Hardware snapshot ($board)</h2>"
              if [ -n "$img" ]; then
                rel="screenshots/$(basename "$img")"
                echo "        <img class=\"screenshot\" src=\"$rel\" alt=\"$board hardware snapshot\">"
              else
                echo "        <div class=\"placeholder\">No hardware snapshot captured</div>"
              fi
              echo "    </div>"
            } >> deploy/site/.cards.html
          done

          # Inject the per-board cards into the template and write index.html.
          awk '
            BEGIN {
              while ((getline line < "deploy/site/.cards.html") > 0) rep = rep line "\n"
            }
            { gsub("__SCREENSHOT_HTML__", rep); print }
          ' deploy/gallery/index.template.html > deploy/site/index.html
          rm -f deploy/site/.cards.html
          echo "gallery assembled: ${#BOARDS[@]} board slot(s)"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
