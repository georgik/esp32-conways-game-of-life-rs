name: Flash & Snap via ESPBrew

# Manual-only hardware workflow.
#
#   * `build`  -> ubuntu: compiles the esp32-s3-box-3 firmware. The xtask
#                 `pack` command then produces a minimal espbrew-ready artifact
#                 (Cargo.toml + .cargo/config.toml +
#                 target/<triple>/release/<elf>) that espbrew auto-discovers on
#                 the runner - a few MB instead of the full target tree. The
#                 browser (wasm) build is disabled for now; when re-enabled it is
#                 published to GitHub Pages and is NEVER sent to espbrew.
#   * `snap`   -> [espbrew] self-hosted runner. That runner is only a *client*
#                 to the ESPBrew cluster leader (the physical board lives on the
#                 leader), so it flashes the firmware and captures a camera frame
#                 via `espbrew snap`. espbrew auto-discovers the project
#                 (Cargo.toml, .cargo/config, target/<triple>/release ELF), so
#                 no manual flash plan is required.
#   * `deploy` -> ubuntu: assembles the GitHub Pages site (screenshot gallery +
#                 the WASM browser game).
#
# Security: this workflow only triggers on manual dispatch, so pull requests
# (including from forks) can never execute steps on the self-hosted hardware
# runner. The snap job also carries a guard step as defense in depth. See the
# note at the bottom of this file about the matching GitHub repository settings.

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'ESPBrew device alias to flash/snap (only esp32-s3-box-3 is wired up)'
        type: string
        default: 'esp32-s3-box-3'
      snap_duration:
        description: 'Snap capture duration (seconds)'
        type: string
        default: '10'
      enable_snap:
        description: 'Flash + capture a hardware snapshot via espbrew snap'
        type: boolean
        default: true
      publish_gallery:
        description: 'Deploy screenshot gallery + WASM browser game to GitHub Pages'
        type: boolean
        default: true

# Self-hosted runners still need read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the esp32-s3-box-3 firmware and the browser (wasm) build.
  # ---------------------------------------------------------------------------
  build:
    name: Build firmware + WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains (ESP + stable)
        run: |
          set -euo pipefail
          # ESP toolchain (xtensa-esp32s3) used by the esp32-s3-box-3 firmware.
          # Install espup from its prebuilt binary — `cargo install espup`
          # recompiles it from source on every run, which is slow and pointless.
          curl -fsSL -o espup \
            "https://github.com/esp-rs/espup/releases/download/v0.18.0/espup-x86_64-unknown-linux-gnu"
          chmod +x espup
          ./espup install --toolchain-version 1.90.0.0
          source ~/export-esp.sh
          # Stable toolchain + wasm32 target for the browser (wasm) build.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        # Prebuilt binary (0.2.100, matching the wasm-bindgen crate version)
        # instead of `cargo install`, which recompiles from source each run.
        # The wasm build is currently disabled (see the commented-out "Build
        # WASM" step), so this is only needed once WASM is re-enabled — but it
        # is cheap to fetch and keeps the step correct for then.
        run: |
          set -euo pipefail
          curl -fsSL -o wb.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.100/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wb.tar.gz
          bin=$(find . -maxdepth 2 -name wasm-bindgen-cli -type f | head -1)
          cp "$bin" ./wasm-bindgen-cli && chmod +x ./wasm-bindgen-cli
          ./wasm-bindgen-cli --version

      - name: Build esp32-s3-box-3 firmware
        run: |
          set -euo pipefail
          cd esp32-s3-box-3
          cargo build --release

      # WASM (browser) build is disabled for now; re-enable later.
      # - name: Build WASM (browser) build
      #   run: |
      #     set -euo pipefail
      #     cd wasm
      #     cargo build --release

      # Build the xtask "pack" artifact: a minimal, espbrew-ready project
      # containing exactly Cargo.toml + .cargo/config.toml +
      # target/xtensa-esp32s3-none-elf/release/<elf>. This is what espbrew's
      # autodetect keys on, and it is a few MB instead of the full 180+ MB
      # target tree.
      - name: Package espbrew artifact (cargo xtask pack)
        run: cargo xtask pack --project esp32-s3-box-3 --verbose

      - name: Upload esp32-s3-box-3 firmware
        # Minimal espbrew-ready project (Cargo.toml, .cargo/config.toml and
        # target/<triple>/release ELF) so espbrew auto-discovers it on the runner.
        #
        # IMPORTANT: include-hidden-files MUST be true. espbrew's autodetect
        # keys on the dot-directory .cargo/config.toml, and upload-artifact@v4
        # drops dot-files/dirs by default (include-hidden-files defaults to
        # false). Without it the artifact has Cargo.toml + ELF but no .cargo/,
        # so espbrew logs "no supported project detected".
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-3-firmware
          path: pack-esp32-s3-box-3/
          include-hidden-files: true
          retention-days: 1

      # WASM build artifact disabled for now; re-enable later.
      # - name: Upload WASM build
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: wasm-build
      #     path: wasm/pkg/
      #     retention-days: 1

  # ---------------------------------------------------------------------------
  # Flash + capture a hardware snapshot on the self-hosted ESPBrew runner.
  #
  # The runner is only a client to the cluster leader, so `espbrew snap`
  # auto-detects the firmware from the downloaded project (target/<triple>/
  # release ELF) and flashes it at the standard app offset. No manual flash
  # plan is required.
  # ---------------------------------------------------------------------------
  snap:
    name: Flash & snap (espbrew)
    needs: build
    if: github.event.inputs.enable_snap == 'true'
    runs-on: [espbrew]
    steps:
      # --- Security: never run on untrusted PR / fork code -------------------
      - name: Refuse to run on PRs / forks
        if: github.event.pull_request != null || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This hardware workflow only runs on manual dispatch."
          echo "::error::It must never execute on pull requests or fork contributions."
          exit 1

      - name: Download firmware pack
        uses: actions/download-artifact@v4
        with:
          name: esp32-s3-box-3-firmware
          path: firmware

      - name: Flash + capture snapshot
        env:
          BOARD: "${{ github.event.inputs.board }}"
          SNAP_DURATION: "${{ github.event.inputs.snap_duration }}"
        run: |
          set -euo pipefail
          # Run espbrew from the pack dir so its autodetect finds the project
          # (Cargo.toml, .cargo/config.toml, target/<triple>/release ELF).
          cd firmware
          # --filter-alias selects the board registered on the ESPBrew leader.
          espbrew snap \
            --filter-alias "${BOARD}" \
            --save-dir snap-out \
            --duration "${SNAP_DURATION}"

      - name: Package snapshot
        # Runs in the repo root: each step gets its own fresh shell, so the
        # `cd firmware` from the previous step does NOT persist here.
        #
        # espbrew snap ran inside firmware/ with --save-dir snap-out, so the
        # captured files live in firmware/snap-out/ as a FLAT layout
        # (snap-*.jpg/.json/.log) - no TIMESTAMP/ subdir.
        run: |
          set -euo pipefail
          snap_dir="firmware/snap-out"
          mkdir -p "${snap_dir}"
          # Zip the captured files into repo-root snapshot.zip. The deploy
          # job searches the archive recursively, so the firmware/ prefix is
          # harmless. (No `ls -dt` globbing: the flat layout has no subdir,
          # and a failed glob under `pipefail`+`set -e` used to abort here.)
          zip -qr -r snapshot.zip "${snap_dir}"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Assemble and publish the GitHub Pages site: the hardware screenshot gallery
  # plus the WASM browser game (built in the `build` job, never flashed).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy gallery (Pages)
    needs: [build, snap]
    # Run when gallery publishing is requested and snap either succeeded or was
    # intentionally skipped (enable_snap=false).
    if: github.event.inputs.publish_gallery == 'true' && (needs.snap.result == 'success' || needs.snap.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM build
        # Disabled for now (wasm build is commented out in the build job).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: deploy/wasm

      - name: Download snapshot (optional)
        # Fails silently when snap was skipped (enable_snap=false).
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: deploy/snapshot
        continue-on-error: true

      - name: Extract snapshot
        run: |
          set -euo pipefail
          mkdir -p deploy/screenshot
          if [ -f deploy/snapshot/snapshot.zip ]; then
            ( cd deploy/snapshot && unzip -o -q snapshot.zip -d ../screenshot )
            echo "snapshot extracted"
          else
            echo "no snapshot available (enable_snap=false?)"
          fi

      - name: Prepare site (wasm + base)
        run: |
          set -euo pipefail
          mkdir -p deploy/site
          # Publish the WASM browser game under ./wasm/ (kept live, never
          # flashed). Disabled for now; harmless when the artifact is absent.
          cp -r deploy/wasm/. deploy/site/wasm/ || true

      - name: Locate and stage screenshot
        id: screenshot
        run: |
          set -euo pipefail
          screenshot=$(find deploy/screenshot -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) 2>/dev/null | head -1)
          if [ -n "${screenshot}" ]; then
            rel=$(printf '%s' "${screenshot}" | sed 's#^deploy/screenshot/##')
            # Stage the screenshot inside the site so it is served from Pages.
            mkdir -p "deploy/site/$(dirname "${rel}")"
            cp "${screenshot}" "deploy/site/${rel}"
            echo "path=${rel}" >> "$GITHUB_OUTPUT"
            echo "screenshot staged: ${rel}"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no screenshot captured"
          fi

      - name: Inject screenshot into gallery template
        env:
          SCREENSHOT_REL: "${{ steps.screenshot.outputs.path }}"
        run: |
          set -euo pipefail
          # The static gallery lives in the repo (deploy/gallery/index.template.html)
          # so this job stays short; only the captured screenshot path is injected.
          if [ -n "${SCREENSHOT_REL}" ]; then
            printf '%s' "<img src=\"${SCREENSHOT_REL}\" alt=\"esp32-s3-box-3 hardware snapshot\" class=\"screenshot\">" > deploy/site/.screenshot.html
          else
            printf '%s' '<div class="placeholder">No hardware snapshot captured yet.</div>' > deploy/site/.screenshot.html
          fi
          awk '
            BEGIN { while ((getline line < "deploy/site/.screenshot.html") > 0) rep = rep line }
            { gsub("__SCREENSHOT_HTML__", rep); print }
          ' deploy/gallery/index.template.html > deploy/site/index.html
          rm -f deploy/site/.screenshot.html
          echo "gallery assembled from template (screenshot=${SCREENSHOT_REL:-none})"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
