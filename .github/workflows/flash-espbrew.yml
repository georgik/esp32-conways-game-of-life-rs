name: Flash & Snap via ESPBrew

# Manual-only hardware workflow.
#
#   * `build`  -> ubuntu: compiles the esp32-s3-box-3 firmware. The xtask
#                 `pack` command then produces a minimal espbrew-ready artifact
#                 (Cargo.toml + .cargo/config.toml +
#                 target/<triple>/release/<elf>) that espbrew auto-discovers on
#                 the runner - a few MB instead of the full target tree.
#   * `wasm`   -> ubuntu: builds the browser (wasm) build IN PARALLEL with
#                 `build` (it needs only stable + wasm32, no xtensa). The result
#                 is published to GitHub Pages in `deploy` and is NEVER sent to
#                 espbrew.
#   * `snap`   -> [espbrew] self-hosted runner. That runner is only a *client*
#                 to the ESPBrew cluster leader (the physical board lives on the
#                 leader), so it flashes the firmware and captures a camera frame
#                 via `espbrew snap`. espbrew auto-discovers the project
#                 (Cargo.toml, .cargo/config, target/<triple>/release ELF), so
#                 no manual flash plan is required.
#   * `deploy` -> ubuntu: assembles the GitHub Pages site (screenshot gallery +
#                 the WASM browser build).
#
# Security: this workflow only triggers on manual dispatch, so pull requests
# (including from forks) can never execute steps on the self-hosted hardware
# runner. The snap job also carries a guard step as defense in depth. See the
# note at the bottom of this file about the matching GitHub repository settings.

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'ESPBrew device alias to flash/snap (only esp32-s3-box-3 is wired up)'
        type: string
        default: 'esp32-s3-box-3'
      snap_duration:
        description: 'Snap capture duration (seconds)'
        type: string
        default: '10'
      enable_snap:
        description: 'Flash + capture a hardware snapshot via espbrew snap'
        type: boolean
        default: true
      publish_gallery:
        description: 'Deploy screenshot gallery + WASM browser build to GitHub Pages'
        type: boolean
        default: true

# Self-hosted runners still need read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the esp32-s3-box-3 firmware. (The browser/wasm build runs in the
  # parallel `wasm` job below, not here.)
  # ---------------------------------------------------------------------------
  build:
    name: Build firmware
    # Pinned to ubuntu-26.04 ahead of the ubuntu-latest migration (2026-10-19)
    # so we validate the toolchain on the upcoming base image.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ESP toolchain
        run: |
          set -euo pipefail
          # ESP toolchain (xtensa-esp32s3) used by the esp32-s3-box-3 firmware.
          # Install espup from its prebuilt binary — `cargo install espup`
          # recompiles it from source on every run, which is slow and pointless.
          curl -fsSL -o espup \
            "https://github.com/esp-rs/espup/releases/download/v0.18.0/espup-x86_64-unknown-linux-gnu"
          chmod +x espup
          ./espup install --toolchain-version 1.90.0.0
          source ~/export-esp.sh
          # Stable toolchain for cargo and the xtask pack step below.
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build esp32-s3-box-3 firmware
        run: |
          set -euo pipefail
          cd esp32-s3-box-3
          cargo build --release

      # Build the xtask "pack" artifact: a minimal, espbrew-ready project
      # containing exactly Cargo.toml + .cargo/config.toml +
      # target/xtensa-esp32s3-none-elf/release/<elf>. This is what espbrew's
      # autodetect keys on, and it is a few MB instead of the full 180+ MB
      # target tree. Runs on the stable host toolchain (no xtensa needed).
      - name: Package espbrew artifact (cargo xtask pack)
        run: cargo xtask pack --project esp32-s3-box-3 --verbose

      - name: Upload esp32-s3-box-3 firmware
        # Minimal espbrew-ready project (Cargo.toml, .cargo/config.toml and
        # target/<triple>/release ELF) so espbrew auto-discovers it on the runner.
        #
        # IMPORTANT: include-hidden-files MUST be true. espbrew's autodetect
        # keys on the dot-directory .cargo/config.toml, and upload-artifact@v4
        # drops dot-files/dirs by default (include-hidden-files defaults to
        # false). Without it the artifact has Cargo.toml + ELF but no .cargo/,
        # so espbrew logs "no supported project detected".
        uses: actions/upload-artifact@v7
        with:
          name: esp32-s3-box-3-firmware
          path: pack-esp32-s3-box-3/
          include-hidden-files: true
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build the browser (wasm) build in PARALLEL with the firmware above. It needs
  # only the stable toolchain + wasm32 target (no xtensa), so it runs on a plain
  # ubuntu runner alongside the [espbrew] flash job. The WASM build is NEVER sent
  # to espbrew — it is published to GitHub Pages in the `deploy` job only.
  # ---------------------------------------------------------------------------
  wasm:
    name: Build WASM browser build
    # Pinned to ubuntu-26.04 ahead of the ubuntu-latest migration (2026-10-19).
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain + wasm32 target
        run: |
          set -euo pipefail
          # WASM needs only stable + wasm32 (no xtensa), so it does not touch the
          # board toolchain and can run in parallel with the firmware build.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Build WASM library (wasm32)
        run: |
          set -euo pipefail
          cd wasm
          # build.rs is a no-op for the wasm32 target, so this only produces the
          # .wasm (it deliberately does NOT build the native serve bin).
          cargo build --lib --target wasm32-unknown-unknown --release

      - name: Install matching wasm-bindgen-cli
        # The CLI schema version must EXACTLY match the wasm-bindgen crate used
        # to build the .wasm, or wasm-bindgen refuses to run. Cargo.lock is not
        # committed, so we read the resolved version at build time and fetch the
        # matching prebuilt CLI instead of `cargo install` (which rebuilds from
        # source each run).
        #
        # NOTE: the musl release tarball ships the CLI as ./wasm-bindgen (the
        # old ./wasm-bindgen-cli name was dropped), sitting at the TOP LEVEL of
        # the extracted dir. We locate it and copy it, then put the repo root on
        # PATH so the packaging step can call it after `cd wasm`.
        id: wb
        run: |
          set -euo pipefail
          wb_version="$(grep -A1 'name = "wasm-bindgen"' wasm/Cargo.lock \
            | awk '/version =/{gsub(/"/, "", $3); print $3; exit}')"
          if [ -z "${wb_version}" ]; then
            echo "::error::could not resolve wasm-bindgen version from wasm/Cargo.lock" >&2
            exit 1
          fi
          echo "version=${wb_version}" >> "$GITHUB_OUTPUT"
          # Extract the tarball into a dedicated, fully-accessible directory so the
          # locate step below only ever scans our own files. Scanning /tmp with
          # `find .` walks restricted dirs (systemd-private-*, snap-private-tmp)
          # that return permission-denied, which makes `find` exit non-zero and
          # trips `set -euo pipefail` — aborting before we even install the CLI.
          extract_dir="/tmp/wasm-bindgen-${wb_version}"
          mkdir -p "${extract_dir}"
          curl -fsSL -o wb.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${wb_version}/wasm-bindgen-${wb_version}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wb.tar.gz -C "${extract_dir}"
          # The musl tarball ships the binary at the top level of its extracted
          # dir (depth 2 from the extraction root), so a maxdepth-2 find is enough.
          bin="$(find "${extract_dir}" -maxdepth 2 -name wasm-bindgen -type f 2>/dev/null | head -1)"
          if [ -z "${bin}" ]; then
            echo "::error::could not locate the wasm-bindgen binary in the tarball" >&2
            exit 1
          fi
          # Install it at the repo root so it is on PATH for the packaging step.
          cp "${bin}" "./wasm-bindgen-cli" && chmod +x "./wasm-bindgen-cli"
          "./wasm-bindgen-cli" --version
          # Repo root (where we just installed wasm-bindgen-cli) on PATH.
          echo "$(pwd)" >> "$GITHUB_PATH"

      - name: Package with wasm-bindgen
        run: |
          set -euo pipefail
          cd wasm
          # Emit pkg/ (js + .wasm). The committed pkg/index.html — the page that
          # is served from Pages — is preserved by wasm-bindgen (it never deletes
          # files it does not manage), so it survives into the artifact.
          wasm-bindgen-cli --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/wasm_conways_game_of_life.wasm
          # Fail loud if the served page is somehow absent (e.g. a future
          # wasm-bindgen that clears the out-dir), rather than shipping a page
          # that 404s on the gallery link.
          if [ ! -f pkg/index.html ]; then
            echo "::error::pkg/index.html is missing after wasm-bindgen" >&2
            exit 1
          fi

      - name: Upload WASM build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: wasm/pkg/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Flash + capture a hardware snapshot on the self-hosted ESPBrew runner.
  #
  # The runner is only a client to the cluster leader, so `espbrew snap`
  # auto-detects the firmware from the downloaded project (target/<triple>/
  # release ELF) and flashes it at the standard app offset. No manual flash
  # plan is required.
  # ---------------------------------------------------------------------------
  snap:
    name: Flash & snap (espbrew)
    needs: build
    if: github.event.inputs.enable_snap == 'true'
    runs-on: [espbrew]
    steps:
      # --- Security: never run on untrusted PR / fork code -------------------
      - name: Refuse to run on PRs / forks
        if: github.event.pull_request != null || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This hardware workflow only runs on manual dispatch."
          echo "::error::It must never execute on pull requests or fork contributions."
          exit 1

      - name: Download firmware pack
        uses: actions/download-artifact@v7
        with:
          name: esp32-s3-box-3-firmware
          path: firmware

      - name: Flash + capture snapshot
        env:
          BOARD: "${{ github.event.inputs.board }}"
          SNAP_DURATION: "${{ github.event.inputs.snap_duration }}"
        run: |
          set -euo pipefail
          # Run espbrew from the pack dir so its autodetect finds the project
          # (Cargo.toml, .cargo/config.toml, target/<triple>/release ELF).
          cd firmware
          # --filter-alias selects the board registered on the ESPBrew leader.
          # --save-dir writes a FLAT layout into firmware/snap-out/ (no
          # TIMESTAMP/ subdir). --zip ../snapshot.zip makes espbrew itself
          # produce the archive (using its built-in archive/zip) at the repo
          # root, so we no longer depend on the external `zip` command.
          espbrew snap \
            --filter-alias "${BOARD}" \
            --save-dir snap-out \
            --zip ../snapshot.zip \
            --duration "${SNAP_DURATION}"

      - name: Upload snapshot
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: snapshot.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Assemble and publish the GitHub Pages site: the hardware screenshot gallery
  # plus the WASM browser build (built in the parallel `wasm` job, never flashed).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy gallery (Pages)
    needs: [build, wasm, snap]
    # Run when gallery publishing is requested and snap either succeeded or was
    # intentionally skipped (enable_snap=false).
    if: github.event.inputs.publish_gallery == 'true' && (needs.snap.result == 'success' || needs.snap.result == 'skipped')
    # Pinned to ubuntu-26.04 ahead of the ubuntu-latest migration (2026-10-19).
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download WASM build
        # The wasm job (below) always uploads this; deploy needs it, so it is
        # present. Downloading it makes `deploy/site/wasm/` available for Pages.
        uses: actions/download-artifact@v7
        with:
          name: wasm-build
          path: deploy/wasm

      - name: Download snapshot (optional)
        # Fails silently when snap was skipped (enable_snap=false).
        uses: actions/download-artifact@v7
        with:
          name: snapshot
          path: deploy/snapshot
        continue-on-error: true

      - name: Extract snapshot
        run: |
          set -euo pipefail
          mkdir -p deploy/screenshot
          if [ -f deploy/snapshot/snapshot.zip ]; then
            ( cd deploy/snapshot && unzip -o -q snapshot.zip -d ../screenshot )
            echo "snapshot extracted"
          else
            echo "no snapshot available (enable_snap=false?)"
          fi

      - name: Prepare site (wasm + base)
        run: |
          set -euo pipefail
          mkdir -p deploy/site
          # Publish the WASM browser build under ./wasm/ (kept live, never
          # flashed). The wasm job uploads it as the `wasm-build` artifact, so
          # this is present whenever deploy runs.
          cp -r deploy/wasm/. deploy/site/wasm/

      - name: Locate and stage screenshot
        id: screenshot
        run: |
          set -euo pipefail
          screenshot=$(find deploy/screenshot -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) 2>/dev/null | head -1)
          if [ -n "${screenshot}" ]; then
            rel=$(printf '%s' "${screenshot}" | sed 's#^deploy/screenshot/##')
            # Stage the screenshot inside the site so it is served from Pages.
            mkdir -p "deploy/site/$(dirname "${rel}")"
            cp "${screenshot}" "deploy/site/${rel}"
            echo "path=${rel}" >> "$GITHUB_OUTPUT"
            echo "screenshot staged: ${rel}"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no screenshot captured"
          fi

      - name: Inject screenshot into gallery template
        env:
          SCREENSHOT_REL: "${{ steps.screenshot.outputs.path }}"
        run: |
          set -euo pipefail
          # The static gallery lives in the repo (deploy/gallery/index.template.html)
          # so this job stays short; only the captured screenshot path is injected.
          if [ -n "${SCREENSHOT_REL}" ]; then
            printf '%s' "<img src=\"${SCREENSHOT_REL}\" alt=\"esp32-s3-box-3 hardware snapshot\" class=\"screenshot\">" > deploy/site/.screenshot.html
          else
            printf '%s' '<div class="placeholder">No hardware snapshot captured yet.</div>' > deploy/site/.screenshot.html
          fi
          awk '
            BEGIN { while ((getline line < "deploy/site/.screenshot.html") > 0) rep = rep line }
            { gsub("__SCREENSHOT_HTML__", rep); print }
          ' deploy/gallery/index.template.html > deploy/site/index.html
          rm -f deploy/site/.screenshot.html
          echo "gallery assembled from template (screenshot=${SCREENSHOT_REL:-none})"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
