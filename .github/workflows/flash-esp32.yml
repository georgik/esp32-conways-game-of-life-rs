name: Flash ESP32 (espbrew)

# Builds every ESP32 project, packages the minimal espbrew flash artifact for
# each (via the existing `cargo xtask pack` step), then on the self-hosted
# runner (which has espbrew + hardware) downloads those artifacts and flashes
# every registered board.
#
# For a Rust no_std ESP release build we do NOT pre-assemble a single flash
# image. We only transfer the project markers plus the built ELF:
#
#     pack-<board>/Cargo.toml
#     pack-<board>/.cargo/config.toml
#     pack-<board>/target/<triple>/release/<elf>
#
# On the runner, `espbrew flash` auto-detects the Rust project from those
# markers, reads the target triple from .cargo/config.toml, locates the ELF, and
# the cluster leader converts it into the bootloader / partitions / app images
# on the server. flash-batch cannot be used for Rust projects (it only understands
# ESP-IDF flash_args), so we invoke the single `flash` command per board.
#
# To add a board: add its espbrew alias to boards.yaml (and make sure the
# project builds). Nothing else needs to change.

on:
  push:
    branches: [ main ]
    paths:
      - "esp32-**/**"
      - "esope-**/**"
      - "m5stack-**/**"
      - "waveshare-**/**"
      - "xtask/**"
      - "boards.yaml"
      - ".github/workflows/flash-esp32.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "esp32-**/**"
      - "esope-**/**"
      - "m5stack-**/**"
      - "waveshare-**/**"
      - "xtask/**"
      - "boards.yaml"
      - ".github/workflows/flash-esp32.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ESPBREW_VERSION: v0.8.1

jobs:
  # ---------------------------------------------------------------------------
  # Build + package (GitHub-hosted runner).
  # ---------------------------------------------------------------------------
  build:
    name: Build + package
    # Pinned to ubuntu-24.04 so the run does not silently migrate to Ubuntu 26
    # and so GitHub-hosted actions keep running on their bundled Node (no
    # "Node.js 20 is being forced to run on Node.js 24" deprecation noise).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install ESP toolchain
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y espflash espup
          espup install --toolchain-version 1.90.0.0
          source ~/export-esp.sh

      - name: Setup Rust stable toolchain
        # `actions-rs/toolchain` was dropped: it is unmaintained, targets
        # Node 20, emits the deprecated `set-output` command, and errors on the
        # `targets` input. The ubuntu runner already ships rustup, so install
        # the toolchain directly.
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup target add \
            riscv32imac-unknown-none-elf \
            riscv32imc-unknown-none-elf
          rustup show

      - name: Setup ESP Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: false
          buildtargets: esp32s3
          ldproxy: false
          version: "1.90.0"

      - name: Build xtask maintenance tool
        run: cargo build --manifest-path xtask/Cargo.toml

      - name: Build all ESP32 projects
        run: cargo xtask build --keep-going

      - name: Package espbrew flash artifacts
        run: cargo xtask pack

      - name: Upload per-board artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flash-files
          # One directory per built project: pack-<board>/{Cargo.toml,.cargo/config.toml,target/<triple>/release/<elf>}
          path: pack-*/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flash (self-hosted hardware runner with espbrew).
  # ---------------------------------------------------------------------------
  flash:
    name: Flash boards
    runs-on: [ self-hosted ]
    needs: build
    # Run even if some builds failed so a single board's failed build does not
    # block flashing the others. Boards whose artifact is missing are skipped.
    if: always()
    env:
      ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download espbrew (arch-aware)
        run: |
          set -euo pipefail
          # The self-hosted runner may be x64 or arm; pick the matching
          # espbrew release so we never land an amd64 binary on an arm64 host
          # (that surfaces as an opaque "exec format error" mid-flash).
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/${ESPBREW_VERSION}/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download build artifacts
        # continue-on-error: the flash job runs even when the build job was
        # cancelled, in which case there is nothing to download.
        uses: actions/download-artifact@v5
        with:
          name: flash-files
          path: flash-files
        continue-on-error: true

      - name: Flash each board
        run: |
          set -euo pipefail

          ESPBREW="$GITHUB_WORKSPACE/espbrew"
          if [ ! -x "$ESPBREW" ]; then
            echo "ERROR: espbrew binary missing at $ESPBREW (download step failed?)"
            exit 1
          fi

          # Read the board manifest: one "alias<TAB>project" line per board.
          # project defaults to alias when the two are identical.
          while IFS=$'\t' read -r alias project; do
            [ -z "${alias:-}" ] && continue
            project="${project:-$alias}"
            artifact_dir="flash-files/pack-${project}"

            if [ ! -d "$artifact_dir" ]; then
              echo "SKIP  ${alias}: no artifact for project '${project}' (build skipped)"
              continue
            fi

            # The artifact MUST carry the three markers espbrew autodetects on:
            # Cargo.toml, .cargo/config.toml, and the ELF under
            # target/<triple>/release/. If the build/pack step shipped a partial
            # artifact (e.g. only Cargo.toml) espbrew's RustESPDetector would
            # find nothing and fail ambiguously — catch that here instead.
            if [ ! -f "$artifact_dir/Cargo.toml" ] \
               || [ ! -f "$artifact_dir/.cargo/config.toml" ]; then
              echo "FAILED ${alias}: artifact missing Cargo.toml/.cargo/config.toml (pack step incomplete)"
              exit 1
            fi
            elf=$(find "$artifact_dir/target" -type f \
                    ! -name '*.d' ! -name '*.o' ! -name '*.rlib' \
                    ! -name '*.rmeta' ! -name '*.a' 2>/dev/null | head -1)
            if [ -z "$elf" ]; then
              echo "FAILED ${alias}: artifact has no ELF under target/<triple>/release (build/pack incomplete)"
              exit 1
            fi

            echo ">>> Flashing ${alias} (project: ${project})"

            # 1) Flash. Run from inside the artifact dir so espbrew auto-detects
            #    the Rust project (Cargo.toml + .cargo/config.toml), locates the
            #    ELF, and has the cluster leader convert it to
            #    bootloader/partitions/app. The single `flash` command has no
            #    --exit-on-error (that is a flash-batch flag), so we fail on the
            #    command's own exit code.
            flash_output=$(
              cd "$artifact_dir"
              "$ESPBREW" --cluster "$ESPBREW_CLUSTER" \
                --filter-alias "$alias" \
                flash 2>&1
            )
            flash_rc=$?
            echo "$flash_output"
            if [ "$flash_rc" -ne 0 ]; then
              echo "FAILED ${alias}: espbrew flash exited with code ${flash_rc}"
              exit 1
            fi

            # 2) Boot verification. Stream the serial console via the cluster
            #    and fail if the firmware crashes: the panic handler prints
            #    "abort() was called". `--exit-on-error` makes the monitor
            #    command return non-zero when that pattern appears, and
            #    --no-raw keeps it non-interactive under CI.
            boot_output=$(
              cd "$artifact_dir"
              "$ESPBREW" --cluster "$ESPBREW_CLUSTER" \
                --filter-alias "$alias" \
                monitor --duration 15 \
                --exit-on-error "abort() was called" \
                --no-raw 2>&1
            )
            boot_rc=$?
            echo "$boot_output"
            if [ "$boot_rc" -ne 0 ]; then
              echo "FAILED ${alias}: firmware crashed on boot (abort() was called)"
              exit 1
            fi

            echo "OK      ${alias}"
          done < <(awk '/^  - alias:/ {a=$3} /^    project:/ {print a "\t" $2}' boards.yaml)

          echo "All flashable boards done."
