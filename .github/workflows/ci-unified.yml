name: CI Unified - Build & Flash

# Single source of truth for building and flashing every ESP32 project.
#
# This used to be split into two workflows that both triggered on push/PR to
# `main` and both ran the expensive `cargo xtask build` step:
#
#   * ci-unified.yml  — build + clippy + upload .bin artifacts
#   * flash-esp32.yml — build + package espbrew artifacts + flash on hardware
#
# Running the same build twice for a single push was pure waste, so the two are
# now one workflow: a single `build` job compiles every project exactly once,
# packages the minimal espbrew flash artifact, and uploads both artifact sets;
# a `flash` job on the self-hosted runner then flashes each board.

on:
  push:
    branches: [ main ]
    paths:
      - "esp32-**/**"
      - "esope-**/**"
      - "m5stack-**/**"
      - "waveshare-**/**"
      - "xtask/**"
      - "boards.yaml"
      - ".github/workflows/ci-unified.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "esp32-**/**"
      - "esope-**/**"
      - "m5stack-**/**"
      - "waveshare-**/**"
      - "xtask/**"
      - "boards.yaml"
      - ".github/workflows/ci-unified.yml"
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        required: false
        default: 'false'
        type: boolean
      keep_going:
        description: 'Continue building even if some projects fail'
        required: false
        default: 'true'
        type: boolean
      reuse_run_id:
        description: 'Reuse flash-files artifacts from a previous run (enter a run-id to skip the build and recycle artifacts)'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # actions/upload-artifact@v5 and download-artifact@v5 still declare
  # `using: node20`, which GitHub is deprecating on runners (checkout@v5 already
  # uses node24, so it is unaffected). This silences the transitional
  # "Node 20 is deprecated" warning until those actions migrate off node20.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build + package (GitHub-hosted runner). Compiles every project exactly once
  # and ships two artifact sets:
  #
  #   * esp32-build-artifacts — the final .bin images (for inspection)
  #   * flash-files           — the minimal espbrew flash artifact per board
  #
  # ---------------------------------------------------------------------------
  build:
    name: Build + package
    # Skip the whole build (and its artifacts) when reusing a previous run's
    # artifacts via the reuse_run_id input — that path only needs the flash job.
    if: ${{ github.event.inputs.reuse_run_id == '' }}
    # Pinned to ubuntu-24.04 so the run does not silently migrate to Ubuntu 26
    # and so GitHub-hosted actions keep running on their bundled Node (no
    # "Node.js 20 is being forced to run on Node.js 24" deprecation noise).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install espup for ESP toolchain management
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y espflash espup
          espup install --toolchain-version 1.90.0.0
          source ~/export-esp.sh

      - name: Setup Rust stable toolchain
        # `actions-rs/toolchain` was dropped: it is unmaintained, targets
        # Node 20, emits the deprecated `set-output` command, and errors on the
        # `targets` input. The ubuntu runner already ships rustup, so install
        # the toolchain directly.
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup target add \
            riscv32imac-unknown-none-elf \
            riscv32imc-unknown-none-elf
          rustup show

      - name: Setup ESP Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: false
          buildtargets: esp32s3
          ldproxy: false
          version: "1.90.0"

      - name: Verify toolchain setup
        run: |
          rustup show
          rustup toolchain list

      - name: Build xtask maintenance tool
        run: |
          cargo build --manifest-path xtask/Cargo.toml

      - name: Build all ESP32 projects
        run: |
          cargo xtask build \
            ${{ github.event.inputs.keep_going == 'true' && '--keep-going' || '' }} \
            ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

      - name: Run clippy on all projects
        run: |
          cargo xtask clippy ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        continue-on-error: true

      - name: Package espbrew flash artifacts
        # Minimal per-board artifact espbrew autodetects on the flash runner:
        # pack-<board>/{Cargo.toml,.cargo/config.toml,target/<triple>/release/<elf>}
        run: cargo xtask pack

      - name: Zip per-board flash artifacts
        # actions/upload-artifact walks the directory tree and silently drops
        # hidden .cargo dot-directories (verified: the extracted artifact lost
        # .cargo while target/ and Cargo.toml survived). Zipping first preserves
        # every marker, then download-artifact just extracts the zip.
        run: zip -r flash-files.zip pack-*/

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find . -name "*.bin" -path "*/target/*/release/*" -exec cp {} artifacts/ \; || true
          find . -name "bootloader.bin" -path "*/target/*" -exec cp {} artifacts/ \; || true
          find . -name "partition-table.bin" -path "*/target/*" -exec cp {} artifacts/ \; || true
          ls -la artifacts/ || echo "No artifacts found"

      - name: Upload build artifacts
        if: hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: esp32-build-artifacts
          path: artifacts/
          retention-days: 30

      - name: Upload per-board flash artifacts
        if: hashFiles('flash-files.zip') != ''
        uses: actions/upload-artifact@v5
        with:
          name: flash-files
          # Single zip so the hidden .cargo/config.toml marker survives transfer
          # (upload-artifact drops dot-directories from a directory glob).
          path: flash-files.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flash (self-hosted hardware runner with espbrew).
  # ---------------------------------------------------------------------------
  flash:
    name: Flash boards
    runs-on: [ self-hosted ]
    needs: build
    # Run even if some builds failed so a single board's failed build does not
    # block flashing the others. Boards whose artifact is missing are skipped.
    if: always()
    env:
      ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download espbrew (arch-aware)
        run: |
          set -euo pipefail
          # The self-hosted runner may be x64 or arm; pick the matching
          # espbrew release so we never land an amd64 binary on an arm64 host
          # (that surfaces as an opaque "exec format error" mid-flash).
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/v0.8.1/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download current build artifacts
        # Only when NOT reusing: pull the artifacts this run's build job uploaded.
        if: ${{ github.event.inputs.reuse_run_id == '' }}
        # continue-on-error: the flash job runs even when the build job was
        # cancelled, in which case there is nothing to download.
        uses: actions/download-artifact@v5
        with:
          name: flash-files
          path: flash-files
        continue-on-error: true

      - name: Download reused artifacts from previous run
        # Reuse mode: recycle artifacts from an earlier run by run-id, skipping
        # the expensive rebuild. repository/run-id target that specific run.
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        # continue-on-error: if the run-id is stale/expired the download fails
        # but we do not want to abort the whole flash job because of it.
        uses: actions/download-artifact@v5
        with:
          name: flash-files
          path: flash-files
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
        continue-on-error: true

      - name: Extract flash artifacts
        run: |
          set -euo pipefail
          mkdir -p flash-files
          cd flash-files
          if [ ! -f flash-files.zip ]; then
            echo "SKIP: flash-files.zip missing (build/upload step did not run)"
            exit 0
          fi
          # download-artifact places the uploaded zip here; unzip restores the
          # pack-<board>/{Cargo.toml,.cargo/config.toml,target/...} layout.
          unzip -o flash-files.zip

      - name: Flash each board
        # DEBUG ONLY: `set -x` prints every command with args expanded so we can
        # pinpoint the exact espbrew failure. ESPBREW_CLUSTER is a masked secret,
        # so the printed --cluster value shows as *** — no leak. Remove once the
        # real error is captured.
        run: |
          set -euo pipefail
          set -x

          ESPBREW="$GITHUB_WORKSPACE/espbrew"
          if [ ! -x "$ESPBREW" ]; then
            echo "ERROR: espbrew binary missing at $ESPBREW (download step failed?)"
            exit 1
          fi

          # Track results so we can print a pass/fail report at the end. A single
          # board failing (e.g. a flaky cluster connection) must NOT stop the
          # others from flashing — this is how the esp-idf-component-raylib
          # examples run CI: attempt every board, then report which passed.
          passed=()
          failed=()

          # Read the board manifest: one "alias<TAB>project" line per board.
          # project defaults to alias when the two are identical.
          while IFS=$'\t' read -r alias project; do
            [ -z "${alias:-}" ] && continue
            project="${project:-$alias}"
            artifact_dir="flash-files/pack-${project}"

            if [ ! -d "$artifact_dir" ]; then
              echo "SKIP  ${alias}: no artifact for project '${project}' (build skipped)"
              failed+=("$alias")
              continue
            fi

            # The artifact MUST carry the three markers espbrew autodetects on:
            # Cargo.toml, .cargo/config.toml, and the ELF under
            # target/<triple>/release/. If the build/pack step shipped a partial
            # artifact (e.g. only Cargo.toml) espbrew's RustESPDetector would
            # find nothing and fail ambiguously — catch that here instead.
            if [ ! -f "$artifact_dir/Cargo.toml" ] \
               || [ ! -f "$artifact_dir/.cargo/config.toml" ]; then
              echo "FAILED ${alias}: artifact missing Cargo.toml/.cargo/config.toml (pack step incomplete)"
              failed+=("$alias")
              continue
            fi
            elf=$(find "$artifact_dir/target" -type f \
                    ! -name '*.d' ! -name '*.o' ! -name '*.rlib' \
                    ! -name '*.rmeta' ! -name '*.a' 2>/dev/null | head -1)
            if [ -z "$elf" ]; then
              echo "FAILED ${alias}: artifact has no ELF under target/<triple>/release (build/pack incomplete)"
              failed+=("$alias")
              continue
            fi

            echo ">>> Flashing ${alias} (project: ${project})"

            # 1) Flash. Run from inside the artifact dir so espbrew auto-detects
            #    the Rust project (Cargo.toml + .cargo/config.toml), locates the
            #    ELF, and has the cluster leader convert it to
            #    bootloader/partitions/app. The single `flash` command has no
            #    --exit-on-error (that is a flash-batch flag), so we fail on the
            #    command's own exit code.
            #
            # Wrap in `set +e`/`set -e` on purpose: a non-zero espbrew return
            # must land in $flash_rc, not trip `set -e` on the assignment and
            # exit silently — which previously hid the real espbrew error behind
            # "Process completed with exit code 1" with no output.
            echo ">>> [1/2] espbrew flash -> ${alias}"
            set +e
            flash_output=$(
              cd "$artifact_dir"
              "$ESPBREW" --cluster "$ESPBREW_CLUSTER" \
                --filter-alias "$alias" \
                flash 2>&1
            )
            flash_rc=$?
            set -e
            echo "$flash_output"
            if [ "$flash_rc" -ne 0 ]; then
              echo "FAILED ${alias}: espbrew flash exited with code ${flash_rc}"
              failed+=("$alias")
              continue
            fi

            # 2) Boot verification. Stream the serial console via the cluster
            #    and fail if the firmware crashes: the panic handler prints
            #    "abort() was called". `--exit-on-error` makes the monitor
            #    command return non-zero when that pattern appears, and
            #    --no-raw keeps it non-interactive under CI.
            echo ">>> [2/2] espbrew monitor -> ${alias}"
            set +e
            boot_output=$(
              cd "$artifact_dir"
              "$ESPBREW" --cluster "$ESPBREW_CLUSTER" \
                --filter-alias "$alias" \
                monitor --duration 15 \
                --exit-on-error "abort() was called" \
                --no-raw 2>&1
            )
            boot_rc=$?
            set -e
            echo "$boot_output"
            if [ "$boot_rc" -ne 0 ]; then
              echo "FAILED ${alias}: firmware crashed on boot (abort() was called)"
              failed+=("$alias")
              continue
            fi

            echo "OK      ${alias}"
            passed+=("$alias")
          done < <(awk '/^  - alias:/ {a=$3} /^    project:/ {print a "\t" $2}' boards.yaml)

          # ---- Report: which boards passed / failed ---------------------------
          # The job still fails (exit 1) if any board failed, but every board has
          # been attempted and the report shows exactly which passed and which
          # failed.
          echo "==================== FLASH REPORT ===================="
          if [ "${#passed[@]}" -gt 0 ]; then
            echo "PASSED (${#passed[@]}): ${passed[*]}"
          else
            echo "PASSED: none"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FAILED (${#failed[@]}): ${failed[*]}"
            echo "===================================================="
            exit 1
          fi
          echo "All flashable boards passed."
          echo "===================================================="
