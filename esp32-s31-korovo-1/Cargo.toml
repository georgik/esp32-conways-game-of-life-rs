[package]
name = "esp32-s31-korovo1-conways-game-of-life"
version = "0.7.0"
authors = ["Juraj Michálek <juraj.michalek@espressif.com>", "Matěj David Ondráček <mathejdo@seznam.cz>"]
edition = "2024"
license = "MIT OR Apache-2.0"

# Empty workspace to avoid being part of parent workspace
[workspace]

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "08cad7187f840171341fb8249c8a07b07316b559", features = ["esp32s31", "unstable"] }
esp-backtrace = {git = "https://github.com/esp-rs/esp-hal.git", rev = "08cad7187f840171341fb8249c8a07b07316b559", features = [
    "panic-handler",
    "println"
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "08cad7187f840171341fb8249c8a07b07316b559", features = ["esp32s31"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "08cad7187f840171341fb8249c8a07b07316b559", features = ["log-04"] }
log = { version = "0.4.29" }

#######esp-alloc = "0.10.0"
esp-alloc = {git = "https://github.com/esp-rs/esp-hal.git", rev = "08cad7187f840171341fb8249c8a07b07316b559", features = ["esp32s31"]}

embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
mipidsi = "0.10.0"
embedded-graphics-framebuf = "0.5.0"
heapless = "0.9.2"
embedded-hal-bus = "0.3.0"


[features]
default = [ "esp-hal/esp32s31", "esp-backtrace/esp32s31", "esp-println/esp32s31" ]
