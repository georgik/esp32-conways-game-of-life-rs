[package]
name = "esp32-p4-function-ev-board-conways-game-of-life"
version = "0.7.0"
authors = ["Juraj Michálek <juraj.michalek@espressif.com>", "Matěj David Ondráček <mathejdo@seznam.cz>"]
edition = "2024"
license = "MIT OR Apache-2.0"

# Empty workspace to avoid being part of parent workspace
[workspace]

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", features = ["esp32p4", "unstable"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", features = [
    "panic-handler",
    "println",
    "esp32p4",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", features = [ "esp32p4", "log-04" ] }
log = { version = "0.4.29" }

esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", features = ["esp32p4"] }
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
mipidsi = "0.10.0"
#esp-display-interface-spi-dma = "0.3.0"
esp-display-interface-spi-dma = { path = "../esp-display-interface-spi-dma"} #SSSSSSSSSSSSSSSSSS
esp-bsp = "0.4.1" #SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS
embedded-graphics-framebuf = "0.5.0"
heapless = "0.9.2"
embedded-hal-bus = "0.3.0"
bevy_ecs = { version = "0.18.1", default-features = false }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", features = ["esp32p4"] }

[features]
default = [ "esp-hal/esp32p4" ]